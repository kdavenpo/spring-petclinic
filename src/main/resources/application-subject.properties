# CS 8674 starting system: clinic-core on the shared MySQL schema.
# Use with:  --spring.profiles.active=subject
# The database container (subject-system-compose.yml) creates the tables and
# sample data, so this service never runs schema or data scripts itself.

spring.application.name=clinic-core
server.port=8080

spring.datasource.url=${MYSQL_URL:jdbc:mysql://localhost:3306/petclinic}
spring.datasource.username=${MYSQL_USER:petclinic}
spring.datasource.password=${MYSQL_PASS:petclinic}
spring.sql.init.mode=never

# Access log: one line per request, including the endpoint template it matched.
server.tomcat.basedir=.
server.tomcat.accesslog.enabled=true
server.tomcat.accesslog.directory=logs
server.tomcat.accesslog.prefix=access-clinic-core
server.tomcat.accesslog.buffered=false
server.tomcat.accesslog.pattern=%t "%r" %s %D tmpl=%{org.springframework.web.servlet.HandlerMapping.bestMatchingPattern}r
